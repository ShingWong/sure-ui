name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref; keep master green at every commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 20 is the floor implied by ES2022 + nodenext resolution and
          # the engines of vitest (^18 || >=20).
          node-version: 20
          cache: npm

      # npm ci, not npm install: this is what verifies the committed lockfile
      # is actually reproducible.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Covers the VERSION assertion in src/index.test.ts, which reads
      # package.json and would catch a version constant drifting out of sync.
      - name: Test
        run: npm test

      # The publish job is gated on lint, build and test, so a regression there
      # blocks a release. This is where it is caught instead, on the commit that
      # introduced it.
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
